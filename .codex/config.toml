# .codex/config.toml — DEVDEPARTMENT reference configuration for CX (Codex AI builder)
#
# Vendored from the ECC .codex asset pattern, adapted to the Coordination Protocol.
# Keep this file PROJECT-LOCAL (committed in the repo root's .codex/), so CX's
# model, effort, and sandbox posture are version-controlled and auditable —
# not scattered across dispatch script CLI flags.
#
# dispatch.sh may still pass flags; project-local config is the source of truth
# and the dispatch flags should be reduced to profile selection over time.
# AGENTS.md at the repo root is auto-detected by Codex; it carries the protocol.

# --- Model discipline (commits 55ce44a + 779746f) -----------------------------
# 2026-08-13: gpt-5.6-sol 400s on ChatGPT-account Codex ("not supported when
# using Codex with a ChatGPT account"). terra is the account's flagship agentic
# coding model (see ~/.codex/models_cache.json), probe-verified.
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"   # medium is the token-budget sweet spot; raise to
                                    # "high" only if quality issues persist on this model.

# --- Sandbox & approvals -------------------------------------------------------
# Matches dispatch.sh: codex exec -s danger-full-access. Builders run inside an
# isolated git worktree, so full FS access within it is the accepted trade-off.
sandbox_mode = "danger-full-access"
approval_policy = "never"           # headless builder sessions; safety comes from
                                    # worktree isolation + territory review + validator.

# --- Profiles -------------------------------------------------------------------
# strict: for supervised debugging of CX behaviour (read-heavy, approval-gated).
[profiles.strict]
sandbox_mode = "read-only"
approval_policy = "on-request"

# builder: the normal DEVDEPARTMENT headless posture (same as top-level defaults).
[profiles.builder]
sandbox_mode = "danger-full-access"
approval_policy = "never"

# --- Environment ------------------------------------------------------------------
# DEVTEAM_UNIT identifies this harness to any hook-capable tooling and scripts.
# [ORCH 2026-09-07] This file is shared by BOTH Codex identities (CX and CX9 —
# same underlying CLI/template, per autopilot.json's builder registry), but a
# `[shell_environment_policy] set = {...}` entry unconditionally OVERWRITES
# whatever dispatch.ps1 already correctly set in the parent process
# ($env:DEVTEAM_UNIT = $Id) for every subprocess Codex spawns — it does not
# merely fill in a default. With DEVTEAM_UNIT hardcoded to "CX" here, CX9's own
# dispatched sessions had every commit rejected by hooks/territory-precommit.js
# ("DEVTEAM_UNIT='CX' but this worktree belongs to CX9"), confirmed live on
# TASK-186 (and suspected but not root-caused on two earlier occasions this
# session). Deliberately NOT set here: Codex's default shell_environment_policy
# inherits the parent process's environment, which is exactly what correctly
# carries dispatch.ps1's per-launch value through for CX, CX9, and any future
# Codex-family identity added to the registry — a static per-identity value
# cannot live in this single shared file without breaking whichever identity
# it doesn't name.
