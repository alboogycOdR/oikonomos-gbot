name: ci

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Workspace package exports point at gitignored dist/. A clean checkout
      # has no dist/, so the test job must build before it tests (TASK-023).
      - run: pnpm build
      - run: pnpm test
      # OIK-047: invalid connector manifest rejected in CI (TASK-043 merge wiring).
      # The CLI exits non-zero on any violation AND when zero manifests are found
      # (ADR-005 liveness), so this step cannot go green vacuously.
      - name: Validate connector manifests
        run: pnpm --filter @oikonomos/connectors validate

  canaries:
    # ADR-001 requires CAN-01..CAN-08 to be CI-BLOCKING — this job failing must
    # fail the build. CAN-02 (a bare-name allowedTools entry for a Tier-3 tool
    # must STILL be denied by L1) is the regression test against the original
    # architecture flaw; directive §6 calls it the most important test here.
    # Postgres is provided so CAN-06 (replay a consumed nonce) and CAN-07
    # (payload mutation invalidates) actually RUN: they are DB-gated on
    # DATABASE_URL and, without it, skip — which would silently leave 2 of the
    # 8 canaries unproven (found in review, TASK-035 rework 2026-08-18).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: oikonomos
          POSTGRES_PASSWORD: oikonomos
          POSTGRES_DB: oikonomos_canaries
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oikonomos -d oikonomos_canaries"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Apply schema (approvals FKs the canaries seed against)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/migrations/001_schema_v1.up.sql
        env:
          DATABASE_URL: postgresql://oikonomos:oikonomos@localhost:5432/oikonomos_canaries
      - name: CAN-01..CAN-08 (CI-blocking)
        run: pnpm canaries
        env:
          DATABASE_URL: postgresql://oikonomos:oikonomos@localhost:5432/oikonomos_canaries

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  banned-modes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node infra/ci/test-banned-modes.mjs
      - run: node infra/ci/banned-modes.mjs

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node infra/ci/test-secret-scan.mjs
      - run: node infra/ci/secret-scan.mjs

  protected-path-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify protected-path review marker
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          marker=""
          if printf '%s' "$PR_BODY" | grep -Fq '<!-- oikonomos-fable-review: approved -->'; then
            marker='--approval-marker fable-reviewed'
          fi
          node infra/ci/protected-path-review.mjs --base "${{ github.event.pull_request.base.sha }}" $marker
      - run: node infra/ci/test-protected-path-review.mjs
