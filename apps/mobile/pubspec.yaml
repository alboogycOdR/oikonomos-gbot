name: oikonomos_mobile
description: >
  OIKONOMOS native mobile client (TASK-144, Mobile Wave 1a) — Flutter
  skeleton, typed Dart API client, SSE realtime client, and shared-token
  login screen mirroring apps/dashboard's web client against the same
  control-api endpoints.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  file_picker: ^8.1.7
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # TASK-152 — apps/mobile/tool/release_remote.dart lives outside the
  # widget-test tree and is run via `dart test`, which needs the
  # standalone `test` package (flutter_test wraps it for widget tests
  # only and isn't resolvable outside a Flutter test runner).
  test: ^1.25.0

flutter:
  uses-material-design: true
